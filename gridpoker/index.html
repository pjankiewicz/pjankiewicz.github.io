<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>GridPoker Wasteland</title>
    <meta name="description" content="GridPoker Wasteland: a 5x5 arcade poker puzzle with radioactive cards.">
    <base href="/gridpoker/">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0e0a08;
        }

        html {
            touch-action: manipulation;
        }

        body, canvas {
            width: 100%;
            height: 100%;
        }

        canvas {
            display: block;
        }

        .status {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: #d6cebb;
            font-family: system-ui, sans-serif;
            background: radial-gradient(circle at top, rgba(94, 43, 17, 0.25), transparent 45%);
        }

        .start {
            appearance: none;
            border: 2px solid #d6cebb;
            background: rgba(214, 206, 187, 0.08);
            color: #f4ecd6;
            padding: 12px 18px;
            font: inherit;
            letter-spacing: 0.08em;
            cursor: pointer;
        }

        .start:disabled {
            opacity: 0.65;
            cursor: wait;
        }

        .hint {
            font-size: 0.95rem;
            opacity: 0.82;
            text-align: center;
            max-width: 28rem;
            line-height: 1.5;
            padding: 0 24px;
        }

        .spinner {
            width: 22px;
            height: 22px;
            border: 3px solid #d6cebb;
            border-color: #d6cebb transparent #d6cebb transparent;
            border-radius: 50%;
            animation: spin 1.2s linear infinite;
        }

        .error {
            color: #ff8b6e;
            max-width: 560px;
            text-align: center;
            line-height: 1.5;
            padding: 0 24px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
  <!-- Umami analytics -->
  <script defer src="https://cloud.umami.is/script.js" data-website-id="d583f5f2-b49f-48e6-af2a-44599356368e"></script>
</head>
<body>
    <div class="status" id="status">
        <div>GridPoker Wasteland</div>
        <button class="start" id="start">Click To Start</button>
        <div class="hint">Browser audio usually needs a user gesture before the game starts.</div>
    </div>

    <script type="module">
        const statusEl = document.getElementById("status");
        const startEl = document.getElementById("start");

        startEl.addEventListener("click", async () => {
            startEl.disabled = true;
            statusEl.innerHTML = `
                <div>Loading GridPoker Wasteland...</div>
                <div class="spinner"></div>
            `;

            try {
                const { default: init } = await import("/gridpoker/gridpoker.js");
                await init("/gridpoker/gridpoker_bg.wasm");
                statusEl.style.display = "none";
            } catch (error) {
                console.error(error);
                statusEl.innerHTML = `
                    <div class="error">
                        <strong>Failed to load GridPoker Wasteland.</strong><br>
                        ${error?.message ?? error}
                    </div>
                `;
            }
        }, { once: true });
    </script>
</body>
</html>
